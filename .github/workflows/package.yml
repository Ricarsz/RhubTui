name: package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  arch-package:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Arch build user
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed base-devel cargo git sudo
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build source tarball
        run: make dist

      - name: Build package
        working-directory: packaging/aur
        run: sudo -u builder makepkg -f --noconfirm --skipchecksums

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rhubtui-package
          path: packaging/aur/*.pkg.tar.zst

      - name: Attach package to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/aur/*.pkg.tar.zst
