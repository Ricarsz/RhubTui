[package]
name = "rhubtui"
version = "0.5.0"
edition = "2024"
description = "USB 设备查看与移动盘挂载（终端 UI）"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
libc = "0.2"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
unicode-width = "0.2"

[[bin]]
name = "rhubtui"
path = "src/main.rs"

[profile.release]
strip = true
lto = true
