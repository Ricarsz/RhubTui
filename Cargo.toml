[package]
name = "rhubtui"
version = "0.3.2"
edition = "2024"
description = "2.4G 键鼠电量、USB 外设面板与挂载管理"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
libc = "0.2"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
unicode-width = "0.2"

[[bin]]
name = "rhubtui"
path = "src/main.rs"

[profile.release]
strip = true
lto = true
